# Render Blueprint — read-only cloud mode (no cron; use GitHub Pages for mobile)

services:

  - type: web

    name: baseball-inning-analysis

    runtime: python

    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:

      - key: PYTHON_VERSION

        value: "3.12.8"

      - key: CLOUD_LITE

        value: "0"

      - key: REFRESH_SECONDS

        value: "3600"

# Always-on baseball analysis (home PC or cheap VPS)
#
#   docker compose up -d --build
#   open http://SERVER_IP:8000
#
# Full live API (CLOUD_LITE=0). Does not depend on Render free tier.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLOUD_LITE: "0"
      REFRESH_SECONDS: "3600"
      WARMUP_START_DELAY: "60"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  app-data:

name: Deploy static UI to GitHub Pages

# Fast path: update HTML/JS/CSS without waiting for a full data refresh.
# Keeps existing docs/data from gh-pages. Shares pages-deploy concurrency
# with refresh-pages.yml so the two never orphan-push gh-pages at once.

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "templates/**"
      - "scripts/build_static_site.py"
      - "scripts/export_docs_incremental.py"
      - "scripts/check_static_ui.py"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Pages site
        run: |
          rm -rf prev_docs
          git fetch origin gh-pages --depth 1
          git worktree add prev_docs origin/gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source static UI before build
        run: python scripts/check_static_ui.py --root .

      - name: Rebuild docs UI (keep published data/)
        run: python scripts/export_docs_incremental.py --ui-only --keep-data prev_docs/data

      - name: Verify built docs UI
        run: python scripts/check_static_ui.py --root docs

      - name: Verify UI markers
        run: |
          test -f docs/data/meta.json
          grep -q 'style.css?v=' docs/index.html
          grep -q 'app.js?v=' docs/index.html
          grep -q 'npb.js?v=' docs/npb/index.html
          grep -q 'cpbl.js?v=' docs/cpbl/index.html
          grep -q 'fetchStaticMatchupWithLiveHeader' docs/static/api_utils.js

      - name: Deploy docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

name: CI tests and lineup policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hourly policy check even when no code push (UTC).
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests + lineup reference policy smoke
        run: python scripts/smoke_lineup_policy.py

name: Refresh data and deploy GitHub Pages

# Full rebuild on a schedule. Pushing code does NOT cancel/rebuild data
# (that was causing "fixed today, broken tomorrow" thrash).

on:
  schedule:
    # Every 2 hours (UTC). Taiwan ≈ UTC+8 → even hours local.
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch previous Pages snapshot
        continue-on-error: true
        run: |
          rm -rf prev_docs
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add prev_docs origin/gh-pages
          else
            mkdir -p prev_docs
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh caches and build docs/
        env:
          CLOUD_LITE: "0"
          REFRESH_CONCURRENCY: "2"
          REFRESH_LEAGUES: "mlb,npb,cpbl"
        run: python scripts/refresh_static_site.py

      - name: Keep previous league data if new build is thinner
        run: python scripts/merge_keep_best.py prev_docs docs

      - name: Verify static site
        run: |
          test -f docs/index.html
          test -f docs/data/mlb/teams.json
          test -f docs/data/meta.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          meta = json.loads(Path("docs/data/meta.json").read_text(encoding="utf-8"))
          print(meta)
          assert meta.get("mlbTeamsCached", 0) >= 20, meta
          assert meta.get("npbTeamsCached", 0) >= 8, meta
          assert meta.get("cpblTeamsCached", 0) >= 4, meta
          # Must look like a real refresh timestamp exists
          assert meta.get("generatedAt"), meta
          PY

      - name: Deploy docs/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

name: Refresh data and deploy GitHub Pages

# Full rebuild on a schedule. Pushing code does NOT cancel/rebuild data
# (that was causing "fixed today, broken tomorrow" thrash).

on:
  schedule:
    # Every 2 hours (UTC). Taiwan ≈ UTC+8 → even hours local.
    - cron: "15 */2 * * *"
    # Game-day window TW 16:00–24:00 ≈ UTC 08:00–16:00 — hourly lineup refresh
    - cron: "5 8-15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages-refresh
  # Allow a new run to cancel a stuck/hung refresh so the site can recover.
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch previous Pages snapshot
        continue-on-error: true
        run: |
          rm -rf prev_docs
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add prev_docs origin/gh-pages
          else
            mkdir -p prev_docs
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh caches and build docs/
        env:
          CLOUD_LITE: "0"
          REFRESH_CONCURRENCY: "2"
          REFRESH_LEAGUES: "mlb,npb,cpbl"
        run: python scripts/refresh_static_site.py

      - name: Audit exported data (fail on wrong game / absurd avgs / thin panels)
        run: python scripts/audit_and_repair_data.py --data-dir docs/data --repair --fail-on-critical

      # Force a re-run path marker so push of audit fixes re-triggers this workflow.
      # (workflow only auto-runs on changes to this file or schedule/manual.)

      - name: Keep previous league data if new build is thinner
        run: python scripts/merge_keep_best.py prev_docs docs

      - name: Verify static site
        run: |
          test -f docs/index.html
          test -f docs/data/mlb/teams.json
          test -f docs/data/meta.json
          test -f docs/data/health.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("docs/data/meta.json").read_text(encoding="utf-8"))
          health = json.loads(Path("docs/data/health.json").read_text(encoding="utf-8"))
          print("meta", {k: meta.get(k) for k in ("generatedAt","mlbTeamsCached","npbTeamsCached","cpblTeamsCached")})
          print("health_ok", health.get("ok"), "critical", health.get("critical"))
          print("cpblApi", health.get("cpblApi"))
          print("cpbl_warnings", (health.get("cpbl") or {}).get("warnings"))
          assert meta.get("mlbTeamsCached", 0) >= 20, meta
          assert meta.get("npbTeamsCached", 0) >= 8, meta
          assert meta.get("cpblTeamsCached", 0) >= 4, meta
          assert meta.get("generatedAt"), meta
          assert not health.get("critical"), health.get("critical")
          PY

      - name: Deploy docs/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com


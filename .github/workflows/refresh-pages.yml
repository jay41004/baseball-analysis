name: Refresh data and deploy GitHub Pages

# Builds full caches on Actions, then publishes to the gh-pages branch.
# Avoids the protected "github-pages" environment that blocked deploys from main.

on:
  schedule:
    # Every 4 hours (UTC). Taiwan ≈ UTC+8 → 08/12/16/20/00/04 local.
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/refresh-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh caches and build docs/
        env:
          CLOUD_LITE: "0"
          REFRESH_CONCURRENCY: "2"
          REFRESH_LEAGUES: "mlb,npb,cpbl"
        run: python scripts/refresh_static_site.py

      - name: Verify static site
        run: |
          test -f docs/index.html
          test -f docs/data/mlb/teams.json
          test -f docs/data/meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("docs/data/meta.json").read_text(encoding="utf-8"))
          print(meta)
          assert meta.get("mlbTeamsCached", 0) >= 20, meta
          PY

      - name: Deploy docs/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
